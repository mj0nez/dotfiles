---
- name: Install base dependencies.
  become: true
  ansible.builtin.apt:
    update_cache: true
    state: present
    pkg:
      - bat
      - build-essential
      - curl
      - dmidecode
      - dnsutils
      - fzf
      - gcc
      - git
      - git-gui
      - gzip
      - htop
      - inxi
      - jq
      - libheif-plugin-libde265 # https://www.omgubuntu.co.uk/2026/05/fix-heic-images-not-loading-ubuntu-26-04
      - make
      - net-tools
      - nmap
      - python3-debian # allows usage of deb822_repository module
      - tar
      - tree
      - vim

- name: Install zsh.
  ansible.builtin.include_tasks: zsh.yml

- name: Install tmux.
  ansible.builtin.include_tasks: tmux.yml

- name: Install direnv.
  ansible.builtin.include_tasks: direnv.yml
